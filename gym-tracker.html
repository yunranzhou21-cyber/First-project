<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>健身追踪</title>
<style>
  :root {
    --bg: #101318;
    --bg-soft: #171b22;
    --panel: #1d232c;
    --panel-2: #232b36;
    --border: #2c3542;
    --text: #e6eaf0;
    --text-dim: #9aa7b6;
    --accent: #4f8df7;
    --accent-dim: #3f6fb8;
    --ok: #3fcf8e;
    --warn: #f2b64d;
    --danger: #e35d6a;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* ===== 左侧菜单 ===== */
  .sidebar {
    width: 220px;
    background: var(--bg-soft);
    border-right: 1px solid var(--border);
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px 18px;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: .5px;
  }
  .brand .logo {
    width: 34px; height: 34px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    display: grid; place-items: center;
    font-size: 17px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px;
    margin-bottom: 6px;
    border-radius: 9px;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
    transition: background .15s, color .15s;
    font-size: 14px;
  }
  .nav-item:hover { background: var(--panel); color: var(--text); }
  .nav-item.active { background: var(--panel); color: var(--text); font-weight: 600; }
  .nav-item .ico { width: 20px; text-align: center; }
  .sidebar-foot { margin-top: auto; font-size: 12px; color: var(--text-dim); padding: 10px 8px; }

  /* ===== 主内容 ===== */
  .main { flex: 1; overflow-y: auto; padding: 24px 30px; }
  .view { display: none; }
  .view.active { display: block; }
  h1.title { font-size: 20px; margin-bottom: 4px; }
  .subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 20px; }

  /* ===== 日历 ===== */
  .cal-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    max-width: 760px; margin-bottom: 12px;
  }
  .cal-toolbar .month-label { font-size: 17px; font-weight: 600; }
  .cal-nav { display: flex; gap: 8px; }
  .cal-nav button, .btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: background .15s;
  }
  .cal-nav button:hover, .btn:hover { background: var(--panel-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { background: var(--accent-dim); }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    max-width: 760px;
  }
  .cal-grid .cell-head {
    text-align: center; font-size: 12.5px; color: var(--text-dim);
    padding: 6px 0; font-weight: 600;
  }
  .cal-day {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex; flex-direction: column;
    align-items: flex-start;
    padding: 7px 8px;
    position: relative; cursor: pointer;
    min-height: 86px;
    gap: 5px;
    transition: transform .1s, border-color .15s, background .15s;
  }
  .cal-day:hover { border-color: var(--accent); transform: translateY(-1px); }
  .cal-day.other { opacity: .35; }
  .cal-day.today { border-color: var(--accent); }
  .cal-day .day-num { font-size: 13px; font-weight: 600; }
  .cal-day .tags { display: flex; flex-wrap: wrap; gap: 3px; }
  .cal-day .tag {
    font-size: 10px; line-height: 1; padding: 3px 5px; border-radius: 4px;
    white-space: nowrap; background: var(--panel-2); color: var(--text-dim);
  }
  .cal-day .tag.part { background: rgba(63,207,142,.16); color: var(--ok); }
  .cal-day .tag.protein { background: rgba(242,182,77,.16); color: var(--warn); }
  .cal-day.has-record { background: var(--panel-2); }
  .legend { display: flex; gap: 18px; margin-top: 14px; color: var(--text-dim); font-size: 12.5px; }
  .legend .lg-chip { display:inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10.5px; margin-right: 5px; vertical-align: 1px; }
  .legend .lg-chip.part { background: rgba(63,207,142,.16); color: var(--ok); }
  .legend .lg-chip.protein { background: rgba(242,182,77,.16); color: var(--warn); }

  /* ===== 弹窗 ===== */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 400px; max-width: 92vw;
    padding: 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .modal h2 { font-size: 17px; margin-bottom: 18px; display:flex; justify-content:space-between; align-items:center; }
  .modal .close { cursor: pointer; color: var(--text-dim); font-size: 20px; }
  .modal .close:hover { color: var(--text); }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 8px; }
  .switch-row { display: flex; align-items: center; justify-content: space-between; }
  .switch-row .lbl { font-size: 14px; }
  /* 开关 */
  .switch { position: relative; width: 42px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: var(--border); border-radius: 24px; transition: .2s;
  }
  .slider:before {
    content: ""; position: absolute; height: 18px; width: 18px;
    left: 3px; bottom: 3px; background: var(--text); border-radius: 50%; transition: .2s;
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider:before { transform: translateX(18px); }
  .switch input:checked + .slider.gym { background: var(--accent); }
  .switch input:checked + .slider.protein { background: var(--warn); }
  /* 部位多选 */
  .parts { display: flex; flex-wrap: wrap; gap: 8px; }
  .part-chip {
    padding: 8px 14px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--panel-2);
    cursor: pointer; font-size: 13px; color: var(--text-dim);
    transition: all .15s; user-select: none;
  }
  .part-chip.sel { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .modal input[type=number] {
    width: 100%; padding: 10px 12px;
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; font-size: 14px;
  }
  .modal input[type=number]:focus { outline: none; border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  /* ===== 体重 ===== */
  .wt-layout { display: grid; grid-template-columns: 1fr 1.4fr; gap: 20px; max-width: 1000px; align-items: start; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px;
  }
  .card h3 { font-size: 15px; margin-bottom: 14px; }
  #weightChart { width: 100%; }
  .wt-entries { list-style: none; max-height: 420px; overflow-y: auto; }
  .wt-entries li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 4px; border-bottom: 1px solid var(--border); font-size: 14px;
  }
  .wt-entries li .val { font-weight: 600; }
  .wt-entries li .unit { color: var(--text-dim); font-size: 12px; margin-left: 3px; }
  .wt-entries .del { color: var(--text-dim); cursor: pointer; border: none; background: none; font-size: 16px; }
  .wt-entries .del:hover { color: var(--danger); }
  .wt-add { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .wt-add input { flex: 1; margin: 0; }
  .empty-note { color: var(--text-dim); text-align: center; padding: 30px 0; font-size: 13px; }
  @media (max-width: 780px) { .wt-layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>

  <!-- 左侧菜单 -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">💪</div>
      <div>健身追踪</div>
    </div>
    <div class="nav-item active" data-view="calendar">
      <span class="ico">📅</span> 训练日历
    </div>
    <div class="nav-item" data-view="weight">
      <span class="ico">⚖️</span> 体重跟踪
    </div>
    <div class="sidebar-foot">数据仅保存在本机浏览器中</div>
  </aside>

  <!-- 主内容 -->
  <main class="main">

    <!-- 训练日历视图 -->
    <section class="view active" id="view-calendar">
      <h1 class="title">训练日历</h1>
      <p class="subtitle">点击日期记录当天训练内容，标记在日历上。</p>
      <div class="cal-toolbar">
        <div class="cal-nav">
          <button id="calPrev">‹</button>
          <span class="month-label" id="monthLabel"></span>
          <button id="calNext">›</button>
        </div>
        <button class="btn" id="calToday">今天</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="legend">
        <span><span class="lg-chip part">部位</span> 训练所练部位</span>
        <span><span class="lg-chip protein">蛋白粉</span> 当天喝了蛋白粉</span>
      </div>
    </section>

    <!-- 体重跟踪视图 -->
    <section class="view" id="view-weight">
      <h1 class="title">体重跟踪</h1>
      <p class="subtitle">记录体重，直观查看变化趋势。</p>
      <div class="wt-layout">
        <div class="card">
          <h3>记录体重</h3>
          <div class="wt-add">
            <input type="number" id="wtInput" placeholder="公斤，如 72.5" step="0.1" min="1">
            <button class="btn primary" id="wtAdd">添加</button>
          </div>
          <ul class="wt-entries" id="wtList"></ul>
          <div class="empty-note" id="wtEmpty">还没有体重记录，添加第一条吧。</div>
        </div>
        <div class="card">
          <h3>趋势</h3>
          <svg id="weightChart" height="300"></svg>
          <div class="empty-note" id="wtChartEmpty">暂无数据，无法绘制趋势。</div>
        </div>
      </div>
    </section>
  </main>

  <!-- 记录弹窗 -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <h2><span id="modalDate"></span><span class="close" id="modalClose">×</span></h2>

      <div class="field">
        <div class="switch-row">
          <span class="lbl">❶ 今天去健身房训练</span>
          <label class="switch"><input type="checkbox" id="swGym"><span class="slider gym"></span></label>
        </div>
      </div>

      <div class="field" id="partsField">
        <label>❷ 练了哪些部位（可多选）</label>
        <div class="parts" id="partsWrap"></div>
      </div>

      <div class="field">
        <div class="switch-row">
          <span class="lbl">❸ 今天喝了蛋白粉</span>
          <label class="switch"><input type="checkbox" id="swProtein"><span class="slider protein"></span></label>
        </div>
      </div>

      <div class="field">
        <label>❹ 体重（公斤，可选填）</label>
        <input type="number" id="modalWeight" placeholder="不填则不记录当天体重" step="0.1" min="1">
      </div>

      <div class="modal-actions">
        <button class="btn" id="modalDelete">清空当天</button>
        <button class="btn primary" id="modalSave">保存</button>
      </div>
    </div>
  </div>

<script>
(function(){
  const KEY = 'gymTracker';
  const PARTS = ['胸','背','肩','手臂','腿','核心','有氧','全身'];

  // ---------- 数据 ----------
  let data = load();

  function load(){
    try {
      const raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : { days: {}, weights: [] };
    } catch(e) { return { days: {}, weights: [] }; }
  }
  function save(){ localStorage.setItem(KEY, JSON.stringify(data)); }

  const dayKey = d => {
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${dd}`;
  };

  // ---------- 导航 ----------
  const navItems = document.querySelectorAll('.nav-item');
  const views = { calendar: document.getElementById('view-calendar'), weight: document.getElementById('view-weight') };
  navItems.forEach(item => {
    item.addEventListener('click', () => {
      navItems.forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      views[item.dataset.view].classList.add('active');
      if (item.dataset.view === 'weight') renderWeight();
    });
  });

  // ---------- 日历 ----------
  let cur = new Date();
  cur.setDate(1);

  function renderCal(){
    const y = cur.getFullYear(), m = cur.getMonth();
    document.getElementById('monthLabel').textContent = `${y} 年 ${m+1} 月`;

    const first = new Date(y, m, 1);
    const startWeekday = first.getDay(); // 0=周日
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const today = new Date();

    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    ['日','一','二','三','四','五','六'].forEach(w => {
      const h = document.createElement('div');
      h.className = 'cell-head'; h.textContent = w;
      grid.appendChild(h);
    });

    // 前置空白（周日起）
    for (let i = 0; i < startWeekday; i++){
      const prev = new Date(y, m, -startWeekday + i + 1);
      const cell = makeDay(prev, true);
      grid.appendChild(cell);
    }
    for (let d = 1; d <= daysInMonth; d++){
      const cell = makeDay(new Date(y, m, d), false);
      if (d === today.getDate() && m === today.getMonth() && y === today.getFullYear()) cell.classList.add('today');
      grid.appendChild(cell);
    }
    // 补足到整行
    const total = startWeekday + daysInMonth;
    const pad = (7 - total % 7) % 7;
    for (let i = 1; i <= pad; i++){
      const next = new Date(y, m+1, i);
      grid.appendChild(makeDay(next, true));
    }
  }

  function makeDay(date, other){
    const key = dayKey(date);
    const rec = data.days[key];
    const cell = document.createElement('div');
    cell.className = 'cal-day' + (other ? ' other' : '');
    const num = document.createElement('div');
    num.className = 'day-num';
    num.textContent = date.getDate();
    cell.appendChild(num);

    if (rec){
      cell.classList.add('has-record');
      const tags = document.createElement('div');
      tags.className = 'tags';
      if (rec.parts && rec.parts.length){
        rec.parts.forEach(p => {
          const t = document.createElement('span');
          t.className = 'tag part'; t.textContent = p;
          tags.appendChild(t);
        });
      }
      if (rec.protein){
        const t = document.createElement('span');
        t.className = 'tag protein'; t.textContent = '蛋白粉';
        tags.appendChild(t);
      }
      if (tags.childElementCount) cell.appendChild(tags);
    }
    cell.addEventListener('click', () => openModal(key));
    return cell;
  }

  document.getElementById('calPrev').addEventListener('click', () => { cur.setMonth(cur.getMonth()-1); renderCal(); });
  document.getElementById('calNext').addEventListener('click', () => { cur.setMonth(cur.getMonth()+1); renderCal(); });
  document.getElementById('calToday').addEventListener('click', () => { cur = new Date(); cur.setDate(1); renderCal(); });

  // ---------- 弹窗 ----------
  const overlay = document.getElementById('overlay');
  const swGym = document.getElementById('swGym');
  const swProtein = document.getElementById('swProtein');
  const modalWeight = document.getElementById('modalWeight');
  const partsWrap = document.getElementById('partsWrap');
  let currentKey = null;
  let selectedParts = [];

  // 生成部位选择
  PARTS.forEach(p => {
    const chip = document.createElement('div');
    chip.className = 'part-chip';
    chip.textContent = p;
    chip.addEventListener('click', () => {
      const i = selectedParts.indexOf(p);
      if (i >= 0) selectedParts.splice(i, 1); else selectedParts.push(p);
      chip.classList.toggle('sel');
    });
    partsWrap.appendChild(chip);
  });
  function renderParts(sel){
    selectedParts = sel ? [...sel] : [];
    [...partsWrap.children].forEach((chip, i) => {
      chip.classList.toggle('sel', selectedParts.includes(PARTS[i]));
    });
  }

  function openModal(key){
    currentKey = key;
    const rec = data.days[key] || {};
    document.getElementById('modalDate').textContent = key;
    swGym.checked = !!rec.gym;
    swProtein.checked = !!rec.protein;
    modalWeight.value = rec.weight != null ? rec.weight : '';
    renderParts(rec.parts || []);
    // 是否训练则显示部位区
    document.getElementById('partsField').style.display = rec.gym ? 'block' : 'none';
    overlay.classList.add('show');
  }

  swGym.addEventListener('change', () => {
    document.getElementById('partsField').style.display = swGym.checked ? 'block' : 'none';
  });

  document.getElementById('modalClose').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  function closeModal(){ overlay.classList.remove('show'); }

  document.getElementById('modalSave').addEventListener('click', () => {
    const key = currentKey;
    let rec = data.days[key] || {};
    rec.gym = swGym.checked;
    rec.parts = swGym.checked ? selectedParts : [];
    rec.protein = swProtein.checked;
    const w = parseFloat(modalWeight.value);
    if (!isNaN(w) && w > 0) rec.weight = w; else delete rec.weight;

    // 若没有去训练、没喝蛋白粉、没部位、没体重，则视为空记录删除
    if (!rec.gym && !rec.protein && !rec.weight) delete rec.weight;

    // 同步到体重记录列表（按日期导入）
    syncWeightFromDays();

    if (!rec.gym && !rec.protein && !rec.weight && (!rec.parts || !rec.parts.length)) {
      delete data.days[key];
    } else {
      data.days[key] = rec;
    }
    save();
    renderCal();
    closeModal();
  });

  document.getElementById('modalDelete').addEventListener('click', () => {
    if (currentKey) delete data.days[currentKey];
    syncWeightFromDays();
    save();
    renderCal();
    closeModal();
  });

  // 从训练日历中的体重，并入体重跟踪（key -> data.weights）
  function syncWeightFromDays(){
    const byKey = {};
    data.weights.forEach(w => byKey[w.date] = w.value);
    Object.keys(data.days).forEach(k => {
      if (data.days[k].weight != null) byKey[k] = data.days[k].weight;
    });
    data.weights = Object.entries(byKey).map(([date, value]) => ({ date, value }))
      .sort((a,b) => a.date < b.date ? -1 : 1);
  }

  // ---------- 体重跟踪 ----------
  const wtInput = document.getElementById('wtInput');
  const wtList = document.getElementById('wtList');
  const wtEmpty = document.getElementById('wtEmpty');
  const wtChartEmpty = document.getElementById('wtChartEmpty');

  function renderWeight(){
    syncWeightFromDays();
    // 列表（倒序）
    const listEl = wtList;
    listEl.innerHTML = '';
    const sorted = [...data.weights].sort((a,b) => a.date < b.date ? 1 : -1);
    if (!sorted.length){
      wtEmpty.style.display = 'block';
      wtChartEmpty.style.display = 'block';
    } else {
      wtEmpty.style.display = 'none';
      wtChartEmpty.style.display = 'none';
    }
    sorted.forEach(w => {
      const li = document.createElement('li');
      const dspan = document.createElement('span');
      const parts = w.date.split('-');
      dspan.textContent = `${parts[0]}-${parts[1]}-${parts[2]}`;
      const vspan = document.createElement('span');
      vspan.innerHTML = `<span class="val">${w.value}</span><span class="unit">kg</span>`;
      const del = document.createElement('button');
      del.className = 'del'; del.textContent = '✕'; del.title = '删除';
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        data.weights = data.weights.filter(x => x.date !== w.date);
        if (data.days[w.date]) delete data.days[w.date].weight;
        save(); renderWeight();
      });
      li.appendChild(dspan);
      const right = document.createElement('span');
      right.style.display = 'flex'; right.style.gap = '10px'; right.style.alignItems = 'center';
      right.appendChild(vspan); right.appendChild(del);
      li.appendChild(right);
      listEl.appendChild(li);
    });
    drawChart();
  }

  document.getElementById('wtAdd').addEventListener('click', addWeight);
  wtInput.addEventListener('keydown', e => { if (e.key === 'Enter') addWeight(); });

  function addWeight(){
    const v = parseFloat(wtInput.value);
    if (isNaN(v) || v <= 0){ wtInput.focus(); return; }
    const key = dayKey(new Date());
    // 写入当日训练记录，便于同一数据源
    if (!data.days[key]) data.days[key] = {};
    data.days[key].weight = v;
    syncWeightFromDays();
    save();
    renderWeight();
    renderCal();
    wtInput.value = '';
  }

  function drawChart(){
    const svg = document.getElementById('weightChart');
    const sorted = [...data.weights].sort((a,b) => a.date < b.date ? -1 : 1);
    svg.innerHTML = '';
    if (sorted.length < 1) return;

    const W = parseInt(svg.getAttribute('width') || 600) || 600;
    const H = 300, padL = 46, padR = 20, padT = 20, padB = 30;
    const innerW = W - padL - padR, innerH = H - padT - padB;

    const vals = sorted.map(w => w.value);
    let min = Math.min(...vals), max = Math.max(...vals);
    if (min === max){ min -= 1; max += 1; }
    const range = max - min;
    const pad = range * 0.15;
    min -= pad; max += pad;

    const x = i => padL + (sorted.length === 1 ? innerW/2 : innerW * i/(sorted.length-1));
    const y = v => padT + innerH - (v - min) / (max - min) * innerH;

    // y 轴网格
    const ticks = 4;
    for (let i = 0; i <= ticks; i++){
      const p = min + (max-min) * i/ticks;
      const yy = y(p);
      const line = document.createElementNS(svgNS, 'line');
      line.setAttribute('x1', padL); line.setAttribute('y1', yy);
      line.setAttribute('x2', W - padR); line.setAttribute('y2', yy);
      line.setAttribute('stroke', '#2c3542'); line.setAttribute('stroke-width', '1');
      svg.appendChild(line);
      const t = document.createElementNS(svgNS, 'text');
      t.setAttribute('x', padL - 8); t.setAttribute('y', yy + 4);
      t.setAttribute('fill', '#9aa7b6'); t.setAttribute('font-size', '11'); t.setAttribute('text-anchor', 'end');
      t.textContent = p.toFixed(1);
      svg.appendChild(t);
    }

    // 数据线
    const path = sorted.map((w,i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(w.value).toFixed(1)}`).join(' ');
    const line = document.createElementNS(svgNS, 'path');
    line.setAttribute('d', path);
    line.setAttribute('fill', 'none');
    line.setAttribute('stroke', '#4f8df7'); line.setAttribute('stroke-width', '2.5');
    line.setAttribute('stroke-linejoin', 'round'); line.setAttribute('stroke-linecap', 'round');
    svg.appendChild(line);

    // 数据点 + 日期标签
    sorted.forEach((w,i) => {
      const cx = x(i), cy = y(w.value);
      const circ = document.createElementNS(svgNS, 'circle');
      circ.setAttribute('cx', cx); circ.setAttribute('cy', cy); circ.setAttribute('r', '4');
      circ.setAttribute('fill', '#4f8df7'); circ.setAttribute('stroke', '#101318'); circ.setAttribute('stroke-width', '1.5');
      svg.appendChild(circ);
      const t = document.createElementNS(svgNS, 'text');
      t.setAttribute('x', cx); t.setAttribute('y', H - padB + 14);
      t.setAttribute('fill', '#9aa7b6'); t.setAttribute('font-size', '10'); t.setAttribute('text-anchor', 'middle');
      t.textContent = w.date.slice(5);
      svg.appendChild(t);
    });
  }
  const svgNS = 'http://www.w3.org/2000/svg';

  // 初始化
  renderCal();
  renderWeight();
})();
</script>
</body>
</html>
